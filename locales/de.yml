# Die Oberfläche, auf Deutsch.
#
# Übersetzt wird die Oberfläche. Die Einträge, Speisekarten, Beschreibungen und
# Bewertungen nicht: das sind Inhalte in der Sprache des Betriebs, und eine
# maschinell übersetzte Speisekarte behauptet Dinge über eine Küche, die keiner
# dort gesagt hat.
#
# Fehlt hier ein Schlüssel, greift der englische Text aus en.yml.
# `buddy lang:check` sagt, welche das sind.

