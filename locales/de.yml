  payments_test_keys: Stripe-Testschlüssel hinterlegt. Die Kasse läuft in der Sandbox.
  payments_no_provider: Kein Zahlungsanbieter hinterlegt. Die Kasse sagt das und verbucht die Bestellung als unbezahlt.
  reviews_name: Keine Bewertungen bei echten Betrieben
  reviews_matters: Die Einträge stammen aus offenen Daten. Erfundene Meinungen unter dem Namen eines echten Restaurants zu veröffentlichen ist das Einzige, was diese Seite niemals tun darf.
  reviews_clean: Jede veröffentlichte Bewertung gehört zu einem der erfundenen Partner.
  reviews_attached: "{count} Bewertung(en) hängen an einem echten Eintrag."
  orders_name: Nur Partner nehmen Bestellungen an
  orders_matters: Ein echter Betrieb weiß nichts von dieser Seite und kann nichts erfüllen, was hier bestellt wird.
  orders_clean: Jede Bestellung gehört zu einem der erfundenen Partner.
  orders_placed: "{count} Bestellung(en) wurden bei einem echten Eintrag aufgegeben."
  contact_name: Keine echten Kontaktdaten gespeichert
  contact_matters: Niemand hat zugestimmt, von einer Demonstration zu hören, und eine Adresse, die auflöst, ist eine Adresse, an die irgendwann etwas gesendet werden kann.
  contact_reserved: "{count} Kundendatensatz/-sätze, alle auf reservierten Demo-Domains, die keine Post empfangen können."
  contact_reachable: "{count} Kundendatensatz/-sätze tragen eine Adresse, die ein echtes Postfach erreichen könnte."
  noindex_name: Seiten tragen noindex
  noindex_matters: Erfundenes über ein echtes Restaurant, indexiert und weit oben, ist genau das Ergebnis, das diese Seite vermeiden soll.
  noindex_present: Das head-Partial gibt auf jeder Seite noindex, nofollow aus.
  noindex_missing: Das head-Partial gibt kein robots-Meta-Tag mehr aus.
