  payments_name: Nur Sandbox-Zahlungen
  payments_matters: Die Betriebe, bei denen bestellt werden kann, sind erfunden. Ein Live-Schlüssel würde eine echte Karte im Namen eines Restaurants belasten, das es nicht gibt.
