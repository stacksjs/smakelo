  onboarding: Zahlungen einrichten
  built: Fertig
  see_it: Ansehen
  menu_title: Speisekarte
  menu_body: Abschnitte, Gerichte und Optionsgruppen, die genau die Fragen stellen, die eine Bestellung wirklich beantwortet braucht. Im Datenmodell und auf der Kundenseite bereits vorhanden.
  hours_title: Speisekarte und Öffnungszeiten
  hours_body: Nimm ein Gericht heraus, wenn es aus ist, und es ist nicht mehr bestellbar - nicht nur ausgeblendet. Ändere die heutigen Zeiten, ohne die Woche anzufassen.
  board_title: Bestellboard
  board_body: Eingehende Bestellungen in der Reihenfolge ihres Eintreffens, älteste zuerst, mit ausgeschriebenen Optionen für die Küche und einem Hinweis, wenn eine schon wartet.
  tables_title: Tische und Codes
  tables_body: Ein Code pro Tisch, der die Speisekarte öffnet, eine Rechnung eröffnet und Runden aufnimmt, bis jemand die Rechnung verlangt. Druckbar.
  couriers_title: Kuriere
  couriers_body: Kuriere der Plattform oder dein eigenes Personal. Live-Standort, Ankunft und Übergabe.
  reviews_title: Bewertungen
  reviews_body: "Bewertungen, als Verteilung statt als ein Durchschnitt, und eine Antwort pro Bewertung. Bewertet werden können nur die erfundenen Partner: die hier gelisteten echten Orte haben nichts zugestimmt, also veröffentlicht niemand Meinungen unter ihrem Namen."
  ops_title: Betrieb
  ops_body: "Ob diese Seite ihre eigenen Zusagen noch einhält, geprüft an der Datenbank statt an dem Code, der sie durchsetzen soll: Sandbox-Zahlungen, keine Bewertungen bei echten Betrieben, keine Bestellungen bei ihnen, keine gespeicherten Kontaktdaten, noindex, robots.txt. Dazu das Ausblenden eines Eintrags, das ihn aus Suche, Karte, seiner Seite und dem Bestellen entfernt."
  claims_title: Ansprüche
  claims_body: Wenn du einen der gelisteten Orte führst und lieber nicht hier stehen möchtest, sagt das Formular das als Erstes. An den Betrieb geht keine E-Mail, und ein Anspruch wird von einem Menschen gelesen.
  payouts_title: Auszahlungen
  payouts_body: "Jede Bestellung hält fest, wem was zusteht: das Essen dir, die Liefergebühr und das gesamte Trinkgeld dem Kurier, die Servicegebühr der Plattform. Die Abrechnung summiert diese Zeilen, und eine Auszahlung schreibt eine eigene Zeile, statt eine Zahl zurückzusetzen."
  headline: Die Betriebsseite, ehrlich gesagt.
  intro: Keine Einrichtungsgebühr, kein monatlicher Mindestumsatz, und du behältst deine eigenen Preise. Speisekarte, Öffnungszeiten, Bestellungen, Tische und Auszahlungen liegen an einer Stelle, und du kannst dir unten jeden Bildschirm ansehen, bevor du dich entscheidest.
  claim_note: "Wenn du einen der hier gelisteten Orte führst und das lieber nicht möchtest, ist das ein vernünftiger Wunsch. Der Eintrag stammt aus OpenStreetMap und Foursquare Open Source Places; öffne ihn, wähle \"Das ist mein Betrieb\" und sag Bescheid - er verschwindet noch am selben Tag."
