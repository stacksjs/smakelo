partner:
  payouts: Uitbetalingen
  built: Klaar
  see_it: Bekijken
  menu_title: Menu
  menu_body: Secties, gerechten en optiegroepen die precies de vragen stellen die een bestelling echt beantwoord wil hebben. Vandaag al aanwezig in het datamodel en aan de klantkant.
  hours_title: Menu en openingstijden
  hours_body: Haal een gerecht weg als het op is en het is niet meer te bestellen, niet alleen verborgen. Pas de tijden van vandaag aan zonder de hele week te bewerken.
  board_title: Bestelbord
  board_body: Binnenkomende bestellingen op volgorde van binnenkomst, oudste eerst, met de opties uitgeschreven voor de keuken en een melding als er een staat te wachten.
  tables_title: Tafels en codes
  tables_body: Een code per tafel die het menu opent, een rekening opent en rondes aanneemt tot iemand om de rekening vraagt. Printbaar.
  couriers_title: Koeriers
  couriers_body: Koeriers van het platform, of je eigen mensen. Live locatie, aankomst en de overdracht.
  reviews_title: Reviews
  reviews_body: "Beoordelingen, als verdeling in plaats van één gemiddelde, en één reactie per review. Alleen de verzonnen partners kunnen worden beoordeeld: de echte zaken die hier staan hebben nergens mee ingestemd, dus niemand publiceert meningen onder hun naam."
  ops_title: Bedrijfsvoering
  ops_body: "Of deze site zijn eigen beloften nog nakomt, getoetst aan de database in plaats van aan de code die ze zou moeten afdwingen: sandbox-betalingen, geen reviews bij echte zaken, geen bestellingen bij ze, geen contactgegevens opgeslagen, noindex, robots.txt. Plus een vermelding weghalen, wat hem uit zoeken, de kaart, zijn pagina en het bestellen verwijdert."
  claims_title: Claims
  claims_body: Als je een van de vermelde zaken runt en hier liever niet staat, zegt het formulier dat als eerste. Er gaat geen e-mail naar de zaak, en een claim wordt door een mens gelezen.
  payouts_body: "Elke bestelling legt vast wie wat toekomt: het eten aan jou, de bezorgkosten en de hele fooi aan de koerier, de servicekosten aan het platform. De afrekening telt die regels op, en uitbetalen schrijft een eigen regel in plaats van een getal op nul te zetten."
  headline: De zakelijke kant, eerlijk gezegd.
  intro: Geen opstartkosten, geen maandelijks minimum, en je houdt je eigen prijzen. Menu, openingstijden, bestellingen, tafels en uitbetalingen zitten op één plek, en je kunt hieronder elk scherm bekijken voordat je beslist.
  claim_note: "Als je een van de hier vermelde zaken runt en dat liever niet hebt, is dat een redelijke wens. De vermelding komt uit OpenStreetMap en Foursquare Open Source Places; open hem, kies \"Dit is mijn zaak\" en zeg het - hij is dezelfde dag weg."

