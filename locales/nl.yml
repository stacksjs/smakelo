# reviews niet: dat is inhoud, in de taal van de zaak zelf, en een machinaal
# vertaalde menukaart beweert dingen over een keuken die niemand daar gezegd
# heeft.
#
# Ontbreekt hier een sleutel, dan valt hij terug op het Engels uit en.yml.
# `buddy lang:check` zegt welke dat zijn.

