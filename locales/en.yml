partner:
  payouts: Payouts
  built: Built
  see_it: See it
  menu_title: Menu
  menu_body: Sections, items, and modifier groups that ask the questions an order actually needs answered. Available in the data model and on the customer side today.
  hours_title: Menu and hours
  hours_body: "Take a dish off when it runs out and it stops being orderable, not just hidden. Change today's hours without editing the week."
  board_title: Orders board
  board_body: Incoming orders as they arrive, oldest first, with the modifiers spelled out for the cook and a note when one has been waiting.
  tables_title: Tables and codes
  tables_body: A code per table that opens the menu, opens a tab, and takes rounds until someone asks for the bill. Printable.
  couriers_title: Couriers
  couriers_body: Platform couriers, or your own staff. Live position, arrival, and the handover.
  reviews_title: Reviews
  reviews_body: "Ratings, a distribution rather than one average, and one reply per review. Only the invented partners can be reviewed: the real places listed here agreed to nothing, so nobody gets to publish opinions under their name."
  ops_title: Operations
  ops_body: "Whether this site is still keeping its own promises, checked against the database rather than against the code that is supposed to enforce them: sandbox payments, no reviews on real businesses, no orders at them, no contact details stored, noindex, robots.txt. Plus taking a listing down, which removes it from search, the map, its page and ordering."
  claims_title: Claims
  claims_body: If you run one of the listed places and would rather not be here, the form says so first. Nothing is emailed to the business, and a claim is read by a person.
  payouts_body: "Every order records who is owed what: the food to you, the delivery fee and the whole tip to the courier, the service fee to the platform. The statement sums those rows, and paying out writes a row of its own rather than clearing a number."
  headline: The merchant side, honestly.
  intro: No setup fee, no monthly minimum, and you keep your own prices. Menu, hours, orders, tables and payouts all live in one place, and you can look through every screen of it below before you decide.
  claim_note: "If you run one of the places listed here and would rather it were not, that is a reasonable thing to want. The listing comes from OpenStreetMap and Foursquare Open Source Places; open it, choose \"This is my business\", and say so - it comes down the same day."

