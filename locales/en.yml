# The interface, in English.
#
# English is the default locale, so this file is also the reference: a key that
# is here and missing from de.yml or nl.yml falls back to this text rather than
# rendering empty. `buddy lang:check` says which those are.
#
# What is translated is the interface. The listings, menus, descriptions and
# reviews are not: they are content, in the language of the business that
# serves it, and machine-translating a menu is how a demonstration starts
# lying about what a kitchen cooks.

