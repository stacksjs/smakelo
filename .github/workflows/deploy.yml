name: Deploy

# Push to deploy.
#
# Gated on CI rather than firing on the push itself: `buddy deploy` activates a
# release atomically, so the failure mode of deploying an untested commit is a
# live site running it, not a red check somebody notices later.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Ship a specific commit without pushing, and reach environments that no
  # branch maps to.
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [production, staging, development]
        default: production

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  # Never cancel a deploy in flight. Half of one is a release uploaded but not
  # activated, or services restarted against the previous release's env.
  cancel-in-progress: false

jobs:
  deploy:
    # `workflow_run` fires for failed runs too — that is the point of the
    # gate, so check the conclusion.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Attach a GitHub Environment to get required reviewers and to scope these
    # secrets to it.
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      # Missing secrets fail this job rather than skipping it.
      #
      # This used to finish green with a notice, on the reasoning that a fresh
      # app has nowhere to deploy to and a red X on day one is worse than no
      # deploy. That trade is wrong once an app is actually live, and it cost
      # exactly what it was designed to avoid noticing: every push to main ran
      # this workflow, reported success, skipped every step, and left a stale
      # site up for days. A deploy that cannot deploy is a failure, and the
      # only useful thing it can do is say so where somebody is looking.
      #
      # A genuinely fresh app opts out with the DEPLOY_OPTIONAL repository
      # variable, which is a deliberate statement that this repo has nowhere
      # to ship to yet - not a default that quietly outlives its reason.
      #
      # Checked here rather than in `if:` on the job, because a job-level
      # condition cannot read `secrets`.
      - name: Is deployment configured?
        id: check
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DEPLOY_OPTIONAL: ${{ vars.DEPLOY_OPTIONAL }}
        run: |
          missing=
          [ -z "$DEPLOY_SSH_KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          [ -z "$DOTENV_PRIVATE_KEY_PRODUCTION" ] && missing="$missing DOTENV_PRIVATE_KEY_PRODUCTION"
          # APP_KEY is not optional and not defaultable. `buddy deploy` writes
          # the environment it runs with to the server, and with no APP_KEY it
          # generates a random one - which replaces production's and signs
          # every existing session out. A deploy that cannot do it correctly
          # must not do it at all.
          [ -z "$APP_KEY" ] && missing="$missing APP_KEY"
          [ -z "$HCLOUD_TOKEN" ] && missing="$missing HCLOUD_TOKEN"

          if [ -z "$missing" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'configured=false' >> "$GITHUB_OUTPUT"

          if [ "$DEPLOY_OPTIONAL" = 'true' ]; then
            echo "::notice::Deployment is not configured (missing:$missing) and DEPLOY_OPTIONAL is set, so this run did nothing."
            exit 0
          fi

          echo "::error::Deployment is not configured, so nothing was deployed. Missing:$missing."
          echo '::error::Add them as secrets on the production environment - DEPLOY_SSH_KEY is a private key the target server trusts, DOTENV_PRIVATE_KEY_PRODUCTION comes from .env.keys. If this repo has nowhere to deploy yet, set the DEPLOY_OPTIONAL repository variable to true.'
          exit 1

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          # The exact commit CI approved, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Bun
        if: steps.check.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Setup Pantry
        if: steps.check.outputs.configured == 'true'
        uses: home-lang/pantry/packages/action@main

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: bun install --frozen-lockfile

      # The deploy talks to the server as root over SSH with BatchMode on, so
      # the key has to be in an agent before it runs — there is no prompt to
      # fall back to.
      - name: Load the deploy key
        if: steps.check.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # An agent is not enough on its own. ts-cloud reads the PUBLIC key off
      # disk to register it on the server, and an agent holds keys in memory
      # and exposes no path, so the deploy died on "SSH public key not found
      # at ~/.ssh/id_ed25519.pub" with the agent perfectly loaded. The public
      # half is derived from the private one rather than carried as a second
      # secret, so the two can never disagree.
      - name: Write the deploy key to disk
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub

      # Write the environment the deploy will ship.
      #
      # `buddy deploy` sends the environment it runs with to the server, and a
      # runner starts with no `.env` at all - so it made one, generated a
      # random APP_KEY into it, and would have replaced production's. Every
      # signed-in session is signed with that key; a new one signs all of them
      # out, and nothing about the deploy looks like it failed.
      #
      # The one deploy that actually reached this point died on a missing
      # Hetzner token first, which is the only reason it did not happen.
      #
      # Written before the deploy rather than passed as environment variables,
      # because it is the file that travels to the server.
      - name: Write the production env
        if: steps.check.outputs.configured == 'true'
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          umask 077
          {
            echo "APP_NAME=Smakelo"
            echo "APP_ENV=production"
            echo "APP_KEY=$APP_KEY"
            echo "APP_URL=https://smakelo.stacksjs.com"
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=/var/lib/smakelo/smakelo.sqlite"
            echo "DB_DATABASE_PATH=/var/lib/smakelo/smakelo.sqlite"
            echo "HCLOUD_TOKEN=$HCLOUD_TOKEN"
            echo "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN"
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID"
          } > .env

          # Belt and braces: if APP_KEY were ever empty the line above would
          # write `APP_KEY=` and the deploy would fill it in for us.
          grep -q '^APP_KEY=.\+' .env || { echo '::error::APP_KEY is empty; refusing to deploy a generated one.'; exit 1; }

      # What is serving right now, so the check afterwards can tell a new
      # release from the old one still being up. Best effort: a site that is
      # down or does not exist yet records nothing, and the check below then
      # only asks for a healthy page rather than a changed one.
      - name: Record the live build
        id: before
        if: steps.check.outputs.configured == 'true' && (github.event.inputs.environment || 'production') == 'production'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://smakelo.stacksjs.com/' }}
        run: |
          build=$(curl -fsS --max-time 20 "$SITE_URL" 2>/dev/null | grep -o 'name="stx-build" content="[^"]*"' | head -1 | sed 's/.*content="//; s/"//') || build=
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Serving before this deploy: ${build:-(nothing reachable)}"

      - name: Deploy
        if: steps.check.outputs.configured == 'true'
        run: ./buddy deploy --${{ github.event.inputs.environment == 'staging' && 'staging' || github.event.inputs.environment == 'development' && 'dev' || 'prod' }} --yes
        env:
          # Decrypts .env.production. Without it the encrypted values silently
          # fall back to defaults, which is how an app deploys with the wrong
          # APP_KEY and invalidates every session it had.
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          # DNS records are written through the registrar that administers the
          # zone, declared in config/cloud.ts. Keep these in the environment
          # even when they are also in .env.production — a missing one now
          # fails loudly instead of reaching for another provider's keys.
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # macOS resource forks in a tarball built on a developer machine make
          # the extraction on the server noisy and occasionally fatal.
          COPYFILE_DISABLE: '1'

      # A deploy that reports success and leaves the old build serving is the
      # failure this workflow exists to catch, and `buddy deploy` cannot catch
      # it: it knows it uploaded and activated a release, not that the public
      # name now resolves to it through DNS, the proxy and TLS.
      #
      # `stx-build` changes on every build, so a value that differs from the
      # one recorded before is a new release actually being served. Polled
      # rather than checked once, because the gateway reload and the DNS or
      # certificate reconciliation above it are not instant.
      - name: Verify the deploy is live
        if: steps.check.outputs.configured == 'true' && (github.event.inputs.environment || 'production') == 'production'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://smakelo.stacksjs.com/' }}
          BEFORE: ${{ steps.before.outputs.build }}
        run: |
          for attempt in $(seq 1 30); do
            body=$(curl -fsS --max-time 20 "$SITE_URL" 2>/dev/null) || body=

            if [ -n "$body" ]; then
              now=$(printf '%s' "$body" | grep -o 'name="stx-build" content="[^"]*"' | head -1 | sed 's/.*content="//; s/"//')

              if [ -n "$now" ] && [ "$now" != "$BEFORE" ]; then
                echo "::notice::$SITE_URL is serving build $now (was ${BEFORE:-nothing})."
                exit 0
              fi

              echo "attempt $attempt: still serving ${now:-an unmarked page}"
            else
              echo "attempt $attempt: no response"
            fi

            sleep 10
          done

          echo "::error::$SITE_URL never began serving a new build after the deploy reported success - it is still on ${BEFORE:-an unknown build}. The release may be uploaded but not activated, or the gateway may still be routing to the previous one."
          exit 1
